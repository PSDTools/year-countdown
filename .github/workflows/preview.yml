name: Deploy PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

# One preview deployment per PR at a time; cancel if a newer push arrives
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get sanitized branch name
        id: branch
        run: |
          BRANCH="${{ github.head_ref }}"
          SANITIZED=$(echo "$BRANCH" \
            | sed 's/[^a-zA-Z0-9-]/-/g' \
            | sed 's/-\+/-/g' \
            | sed 's/^-//;s/-$//')
          echo "name=$SANITIZED" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /year-countdown/previews/${{ steps.branch.outputs.name }}

      - name: Deploy preview
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          target-folder: previews/${{ steps.branch.outputs.name }}

      - name: Post preview URL comment
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = `https://psdtools.github.io/year-countdown/previews/${{ steps.branch.outputs.name }}/`;
            const marker = '<!-- preview-deployment-comment -->';
            const body = `${marker}\n## 🚀 Preview Deployment\n\nYour preview is ready!\n\n**${previewUrl}**\n\n> This preview will be automatically removed when the PR is closed.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
