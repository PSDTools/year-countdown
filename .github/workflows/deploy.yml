name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - copilot/**
  workflow_dispatch:

permissions:
  contents: write  # for JamesIves to push to gh-pages branch
  pages: write     # for Pages API to configure the deployment source

# Allow only one concurrent deployment, cancelling any in-progress run
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /year-countdown

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build
          clean: true

      - name: Configure Pages source to gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS=$(curl -s -o response.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}')
          if echo "$STATUS" | grep -qE '^2'; then
            echo "Pages source configured to gh-pages branch (HTTP $STATUS)"
          else
            echo "Warning: Pages API returned HTTP $STATUS — manual configuration may be needed"
            cat response.json || true
          fi
